name: Run MAUI Tests

on:
  push:
    branches: [ main, develop, release ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: windows-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 8.0.x
        
    - name: Run tests directly
      run: dotnet test ./TestCore/TestCore.csproj --configuration Release